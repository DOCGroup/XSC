name: linux

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * SUN'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - feature: C++17
            optional_macros: c++std=c++17
            platform_file: include $(ACE_ROOT)/include/makeinclude/platform_linux.GNU
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} default compiler ${{ matrix.feature }}
    env:
      DOC_ROOT: ${{ github.workspace }}/ACE_TAO
      ACE_ROOT: ${{ github.workspace }}/ACE_TAO/ACE
      TAO_ROOT: ${{ github.workspace }}/ACE_TAO/TAO
      MPC_ROOT: ${{ github.workspace }}/ACE_TAO/MPC
      XSC_ROOT: ${{ github.workspace }}/
      LD_LIBRARY_PATH: ${{ github.workspace }}/XSC/utils:${{ github.workspace }}/lib:${{ github.workspace }}/ACE_TAO/ACE/lib
    steps:
    - name: checkout XSC
      uses: actions/checkout@v7
    - name: checkout ACE/TAO
      uses: actions/checkout@v7
      with:
        repository: DOCGroup/ACE_TAO
        path: ${{ env.DOC_ROOT }}
    - name: checkout MPC
      uses: actions/checkout@v7
      with:
        repository: DOCGroup/MPC
        path: ${{ env.MPC_ROOT }}
    - name: Add Repo
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key|sudo apt-key add -
        sudo apt-add-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ ${{ matrix.Repo }} main"
      if: matrix.Repo != ''
    - name: Add packages
      run: |
        sudo apt-get --yes install libxerces-c-dev libssl-dev libboost-all-dev ${{ matrix.PackageDeps }}
    - name: create $ACE_ROOT/ace/config.h
      run: |
        '#include "ace/config-linux.h"' > ${env:ACE_ROOT}/ace/config.h
      shell: pwsh
    - name: create $ACE_ROOT/include/makeinclude/platform_macros.GNU
      run: |
        'boost=1' > ${env:ACE_ROOT}/include/makeinclude/platform_macros.GNU
        'xerces3=1' >> ${env:ACE_ROOT}/include/makeinclude/platform_macros.GNU
        'ssl=1' >> ${env:ACE_ROOT}/include/makeinclude/platform_macros.GNU
      shell: pwsh
    - name: add optional optional macros
      run: |
        '${{ matrix.optional_macros }}' >> ${env:ACE_ROOT}/include/makeinclude/platform_macros.GNU
      shell: pwsh
      if: matrix.optional_macros != ''
    - name: extend $ACE_ROOT/include/makeinclude/platform_macros.GNU
      run: |
        '${{ matrix.platform_file }}' >>  ${env:ACE_ROOT}/include/makeinclude/platform_macros.GNU
      shell: pwsh
    - name: create $ACE_ROOT/bin/MakeProjectCreator/config/default.features
      run: |
        'boost=1' > ${env:ACE_ROOT}/bin/MakeProjectCreator/config/default.features
        'xerces3=1' >> ${env:ACE_ROOT}/bin/MakeProjectCreator/config/default.features
        'xsc=1' >> ${env:ACE_ROOT}/bin/MakeProjectCreator/config/default.features
      shell: pwsh
    - name: add optional optional feature
      run: |
        '${{ matrix.optional_feature }}' >> ${env:ACE_ROOT}/bin/MakeProjectCreator/config/default.features
      if: matrix.optional_feature != ''
      shell: pwsh
    - name: Run mwc.pl on $(XSC_ROOT)/XSC.mwc
      run: |
        perl ${env:ACE_ROOT}/bin/mwc.pl -type gnuace ${env:XSC_ROOT}/XSC.mwc -workers 4
      shell: pwsh
    - name: Build XSC project
      run: |
        make -j 6 -C ${env:XSC_ROOT}
      shell: pwsh
    - name: Build XSC examples
      run: |
        perl ${env:ACE_ROOT}/bin/mwc.pl -type gnuace -include ${env:XSC_ROOT}/MPC/config -include ${env:XSC_ROOT}/contrib/CCF/CCF/MPC/config ${env:XSC_ROOT}/Examples -workers 4
        make -j 6 -C ${env:XSC_ROOT}/Examples
      shell: pwsh
    - name: Compile generated schema tests
      run: |
        $testRoot = Join-Path ${env:RUNNER_TEMP} xsc-tests
        Copy-Item -Recurse ${env:XSC_ROOT}/Tests $testRoot
        $schemas = @(
          'Abstract/abstract.xsd',
          'Anonymous/test.xsd',
          'Chameleon/includer.xsd',
          'ComplexTypeImport/importer.xsd',
          'Escape/test.xsd',
          'Group/test.xsd',
          'Import/importer.xsd',
          'Include/includer.xsd',
          'NoNamespace/test.xsd',
          'UnqualifiedImport/lib.xsd'
        )
        $schemas | ForEach-Object {
          $schema = Join-Path $testRoot $_
          Push-Location (Split-Path -Parent $schema)
          try {
            & ${env:XSC_ROOT}/bin/xsc --backend cxx --cxx-cpp17 (Split-Path -Leaf $schema)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }
        }
        Get-ChildItem -Path $testRoot -Recurse -Filter *.cpp | ForEach-Object {
          g++ -std=c++17 -I${env:XSC_ROOT} -I${env:ACE_ROOT} -c $_.FullName -o "$($_.FullName).o"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      shell: pwsh
